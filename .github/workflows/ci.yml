name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Check undefined names and syntax
        run: python -m ruff check --select F821,F822,F823,E9 .
      - name: Run offline tests including GUI
        run: xvfb-run -a python -m pytest --run-gui -q
      - name: Test extension message handling
        run: node --test tests/test_extension_audit.cjs
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements-dev.lock --no-deps --disable-pip
      - name: Audit release dependencies
        run: npm audit --package-lock-only --audit-level=low
